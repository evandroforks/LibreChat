# ------------------------------------------------------------
# evandro-librechat.eastus2.cloudapp.azure.com
# ------------------------------------------------------------



map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "api";
  set $port           3080;

  listen 80;
listen [::]:80;

listen 443 ssl;
listen [::]:443 ssl;


  server_name evandro-librechat.eastus2.cloudapp.azure.com;
http2 off;


  # Let's Encrypt SSL
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-3/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-3/privkey.pem;












    # Force SSL
    include conf.d/include/force-ssl.conf;





  access_log /data/logs/proxy-host-1_access.log proxy;
  error_log /data/logs/proxy-host-1_error.log warn;

proxy_read_timeout 1800s;
proxy_connect_timeout 1800s;
proxy_send_timeout 1800s;

# For SSE/streaming (important for LibreChat)
proxy_buffering off;
proxy_cache off;
chunked_transfer_encoding on;

# WebSocket support (if needed)
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";


  location /proxy/ {
    proxy_redirect ~^http://[^/]+/(.+)$ /proxy/$1;
proxy_set_header Accept-Encoding "";
sub_filter_types text/html text/css text/javascript application/javascript;
sub_filter_once off;
sub_filter 'action="/' 'action="/proxy/';
sub_filter 'href="/' 'href="/proxy/';
sub_filter 'src="/' 'src="/proxy/';
sub_filter "action='/" "action='/proxy/";
sub_filter "href='/" "href='/proxy/";
sub_filter "src='/" "src='/proxy/";


    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Real-IP		$remote_addr;

    proxy_pass       http://10.0.0.4:80/;






    # Force SSL
    include conf.d/include/force-ssl.conf;









  }





  location / {











    # Proxy!
    include conf.d/include/proxy.conf;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
